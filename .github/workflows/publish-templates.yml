name: Publish templates

on:
  workflow_run:
    workflows: [Project cover]
    types: [completed]
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Verify latest factory main
        run: |
          set -eu
          git fetch --quiet origin main
          git merge --ff-only origin/main
          npm ci
          npm run release:check
      - name: Publish and verify both templates
        env:
          GH_TOKEN: ${{ secrets.TEMPLATE_PUBLISH_TOKEN }}
        run: |
          set -eu
          if [ -z "$GH_TOKEN" ]; then
            echo 'Configure TEMPLATE_PUBLISH_TOKEN to publish the generated templates.' >&2
            exit 1
          fi
          gh auth setup-git --hostname github.com --force
          git config --global user.name 'template-publisher'
          git config --global user.email 'template-publisher@users.noreply.github.com'
          npm run template:publish -- all --history append --replay --yes
